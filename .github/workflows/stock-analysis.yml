name: Stock Analysis Pipeline

on:
  schedule:
    # 平日毎朝 08:17 JST (UTC 前日 23:17): 保有買い増し判断＋Watch判定＆スケジュール更新 (1コール省エネ)
    - cron: '17 23 * * 0-4'
    # 毎週月曜 07:30 JST (UTC 日曜 22:30): 中長期セクター確認＆新規Watch候補発掘
    - cron: '30 22 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: '実行モード'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - weekly
          - all
      weekly_model:
        description: 'Weekly (セクター＆候補発掘) モデル'
        required: true
        default: 'gemini-4-hydrogen'
        type: choice
        options:
          - gemini-4-hydrogen
          - gemini-4-neon
          - gemini-3.8-flash
          - gemini-3.5-flash-lite
      action_model:
        description: 'Daily (保有・Watch判定) モデル'
        required: true
        default: 'gemini-4-neon'
        type: choice
        options:
          - gemini-4-neon
          - gemini-4-hydrogen
          - gemini-3.8-flash
          - gemini-3.5-flash-lite

permissions:
  contents: read

concurrency:
  group: stock-analysis-pipeline
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/stock-analysis/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/stock-analysis/requirements.txt

      - name: Run pipeline unit tests
        run: python -m unittest discover -s scripts/stock-analysis -p "test_*.py" -v

      - name: Determine mode and model
        id: config
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "weekly_model=${{ inputs.weekly_model }}" >> "$GITHUB_OUTPUT"
            echo "action_model=${{ inputs.action_model }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 22 * * 0" ]; then
            echo "mode=weekly" >> "$GITHUB_OUTPUT"
            echo "weekly_model=gemini-4-hydrogen" >> "$GITHUB_OUTPUT"
            echo "action_model=gemini-4-neon" >> "$GITHUB_OUTPUT"
          else
            echo "mode=daily" >> "$GITHUB_OUTPUT"
            echo "weekly_model=gemini-4-hydrogen" >> "$GITHUB_OUTPUT"
            echo "action_model=gemini-4-neon" >> "$GITHUB_OUTPUT"
          fi

      - name: Run stock analysis pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GEMINI_MARKET_MODEL: ${{ steps.config.outputs.weekly_model }}
          GEMINI_ACTION_MODEL: ${{ steps.config.outputs.action_model }}
        run: |
          python scripts/stock-analysis/run_pipeline.py --mode "${{ steps.config.outputs.mode }}" --weekly-model "${{ steps.config.outputs.weekly_model }}" --action-model "${{ steps.config.outputs.action_model }}"
