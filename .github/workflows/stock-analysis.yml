name: Stock Analysis Pipeline

on:
  schedule:
    # 平日毎朝 07:30 JST (UTC 前日 22:30): 市場概況 + 保有シナリオの門番判定
    - cron: '30 22 * * 0-4'
    # 毎週日曜 08:00 JST (UTC 土曜 23:00): セクター分析 + 銘柄スクリーニング
    - cron: '0 23 * * 6'
  workflow_dispatch:
    inputs:
      mode:
        description: '実行モード'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - weekly
          - all
      model:
        description: '使用モデル'
        required: true
        default: 'gemini-4-hydrogen'
        type: choice
        options:
          - gemini-4-hydrogen
          - gemini-4-neon
          - gemini-3.8-flash
          - gemini-3.5-flash-lite

permissions:
  contents: read

concurrency:
  group: stock-analysis-pipeline
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/stock-analysis/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/stock-analysis/requirements.txt

      - name: Run pipeline unit tests
        run: python -m unittest discover -s scripts/stock-analysis -p "test_*.py" -v

      - name: Determine mode and model
        id: config
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "model=${{ inputs.model }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 23 * * 6" ]; then
            echo "mode=weekly" >> "$GITHUB_OUTPUT"
            echo "model=gemini-4-neon" >> "$GITHUB_OUTPUT"
          else
            echo "mode=daily" >> "$GITHUB_OUTPUT"
            echo "model=gemini-4-hydrogen" >> "$GITHUB_OUTPUT"
          fi

      - name: Run stock analysis pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GEMINI_MODEL: ${{ steps.config.outputs.model }}
        run: |
          python scripts/stock-analysis/run_pipeline.py --mode "${{ steps.config.outputs.mode }}" --model "${{ steps.config.outputs.model }}"
