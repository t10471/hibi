name: Stock Analysis Pipeline

on:
  # 定期実行は Firebase Cloud Functions (dailyStockAnalysis / weeklyStockDiscovery) へ移行済み。
  # GitHub Actions 側は手動バックアップ実行（workflow_dispatch）のみ残しています。
  workflow_dispatch:
    inputs:
      mode:
        description: '実行モード'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - weekly
          - all
      weekly_model:
        description: 'Weekly (セクター＆候補発掘) モデル'
        required: true
        default: 'gemini-4-hydrogen'
        type: choice
        options:
          - gemini-4-hydrogen
          - gemini-4-neon
          - gemini-3.8-flash
          - gemini-3.5-flash-lite
      action_model:
        description: 'Daily (保有・Watch判定) モデル'
        required: true
        default: 'gemini-4-neon'
        type: choice
        options:
          - gemini-4-neon
          - gemini-4-hydrogen
          - gemini-3.8-flash
          - gemini-3.5-flash-lite

permissions:
  contents: read

concurrency:
  group: stock-analysis-pipeline
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: scripts/stock-analysis/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/stock-analysis/requirements.txt

      - name: Run pipeline unit tests
        run: python -m unittest discover -s scripts/stock-analysis -p "test_*.py" -v

      - name: Determine mode and model
        id: config
        run: |
          echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          echo "weekly_model=${{ inputs.weekly_model }}" >> "$GITHUB_OUTPUT"
          echo "action_model=${{ inputs.action_model }}" >> "$GITHUB_OUTPUT"

      - name: Run stock analysis pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GEMINI_MARKET_MODEL: ${{ steps.config.outputs.weekly_model }}
          GEMINI_ACTION_MODEL: ${{ steps.config.outputs.action_model }}
        run: |
          python scripts/stock-analysis/run_pipeline.py --mode "${{ steps.config.outputs.mode }}" --weekly-model "${{ steps.config.outputs.weekly_model }}" --action-model "${{ steps.config.outputs.action_model }}"
